<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Løbecoach</title>
<style>
:root{--bg:#f6f6f8;--fg:#1c1c22;--mut:#6b6b78;--card:#fff;--line:#dcdce3;--pri:#1d6fe0;--good:#e6f4ea;--warn:#fff4dc;--bad:#fde7e7}
@media(prefers-color-scheme:dark){:root{--bg:#141418;--fg:#ececf1;--mut:#9a9aa8;--card:#1e1e25;--line:#33333d;--pri:#5b9cf5;--good:#183324;--warn:#3a2f14;--bad:#3d1c1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px}h1{font-size:22px;margin:4px 0 12px}h3{margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow:auto}nav button{flex:1;white-space:nowrap}
button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.pri,nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.good{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}.busy{opacity:.8}.mut{color:var(--mut)}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}label.chk{display:inline-flex;gap:4px;align-items:center;margin:4px 8px 4px 0;color:var(--fg)}
input,select{display:block;width:100%;margin-top:4px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=checkbox]{display:inline;width:auto;margin:0}.ev{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--pri);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
details.wk{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:8px 12px}details.wk>summary{cursor:pointer}
details.wo{margin:6px 0 0 8px}details.wo>summary{cursor:pointer;font-size:14px}pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px;font-size:12.5px;margin:6px 0}
.ph{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--line)}table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}nav.sub{margin-bottom:10px}nav.sub button{padding:6px 10px}.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.done{text-decoration:line-through;color:var(--mut)}label.shop{display:flex;margin:6px 0}.ev button{flex:none}
table.tight td{font-size:12px;padding:3px 4px;text-align:right}table.tight td:first-child{text-align:left}code{font-size:12px;word-break:break-all}</style></head>
<body><div id="app"></div>
<script>
// ===== ENGINE: ren logik uden DOM (kan testes i node) =====
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const mmss = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + pad(s % 60); };
const parsePace = t => { const [m, s] = String(t).split(':').map(Number); return m * 60 + (s || 0); };
const parseTime = t => { const p = String(t).split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + (p[1] || 0); };
const fmtTime = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); };
const DOW = ['Søn', 'Man', 'Tir', 'Ons', 'Tor', 'Fre', 'Lør'];

// Tærskelpace (sek/km) ud fra et løbsresultat: pace for ~1 times indsats via Riegel (exp 1.06)
const thrFromRace = (km, sec) => 3600 / (km * Math.pow(3600 / sec, 1 / 1.06));

// Zoner som % af tærskel-FART (samme konvention som "% Pace" i Intervals.icu)
const ZN = { easy: [72, 82], rec: [60, 72], steady: [88, 93], thr: [97, 101], vo2: [105, 109], rep: [108, 113], str: [112, 118] };
const zt = (c, k) => `${c.ZN[k][0]}-${c.ZN[k][1]}% Pace`;
const midPct = (c, k) => (c.ZN[k][0] + c.ZN[k][1]) / 2;
const paceOf = (c, k) => c.thr / (midPct(c, k) / 100);
const paceRange = (c, k) => `${mmss(c.thr / (c.ZN[k][1] / 100))}-${mmss(c.thr / (c.ZN[k][0] / 100))}/km`;
const minKm = (c, k, m) => m * 60 / paceOf(c, k);

// Ét step: spec {m|km|min|s}, zone-nøgle
function stp(c, spec, zone) {
  let txt, km;
  if (spec.m) { txt = `${spec.m}mtr`; km = spec.m / 1000; }
  else if (spec.km) { txt = `${spec.km}km`; km = spec.km; }
  else if (spec.min) { txt = `${spec.min}m`; km = minKm(c, zone, spec.min); }
  else { txt = `${spec.s}s`; km = minKm(c, zone, spec.s / 60); }
  return { line: `- ${txt} ${zt(c, zone)}`, km };
}
// Blok: titel, gentagelser, [[spec, zone]...]
function blk(c, title, reps, steps, note) {
  const ss = steps.map(([sp, z]) => stp(c, sp, z));
  const km = reps * ss.reduce((a, s) => a + s.km, 0);
  return { km, lines: [`${title}${reps > 1 ? ' ' + reps + 'x' : ''}${note ? ' (' + note + ')' : ''}`, ...ss.map(s => s.line), ''] };
}
const wrap = (c, name, main, wuKm = 2.5, cdKm = 2) => {
  const w = blk(c, 'Warmup', 1, [[{ km: wuKm }, 'easy']], paceRange(c, 'easy'));
  const d = blk(c, 'Cooldown', 1, [[{ km: cdKm }, 'easy']]);
  return { name, km: w.km + main.reduce((a, b) => a + b.km, 0) + d.km, lines: [...w.lines, ...main.flatMap(b => b.lines), ...d.lines] };
};

// ---- Sessionsbibliotek (progression via k = n'te gang sessionen bruges) ----
const VO2 = [[6, 400, 1.5, 'rep'], [5, 800, 2, 'vo2'], [4, 1000, 2.5, 'vo2'], [6, 800, 2, 'vo2'], [5, 1000, 2.5, 'vo2'], [4, 1200, 3, 'vo2'], [3, 1600, 3, 'vo2']];
const THR = [[3, 8], [3, 10], [2, 15], [3, 12], [2, 18], [2, 20]];
const sVO2 = (c, k) => { const [r, m, rec, z] = VO2[Math.min(k, VO2.length - 1)]; return wrap(c, `Intervaller ${r}x${m}m`, [blk(c, 'Main set', r, [[{ m }, z], [{ min: rec }, 'rec']], paceRange(c, z))]); };
const sTHR = (c, k) => { const [r, m] = THR[Math.min(k, THR.length - 1)]; return wrap(c, `Tærskel ${r}x${m} min`, [blk(c, 'Main set', r, [[{ min: m }, 'thr'], [{ min: 2 }, 'rec']], paceRange(c, 'thr'))]); };
const sFART = (c, k) => wrap(c, 'Fartlek 8x1 min', [blk(c, 'Main set', 8 + Math.min(k, 3), [[{ min: 1 }, 'vo2'], [{ min: 1 }, 'rec']], paceRange(c, 'vo2'))]);
const sRACE = (c, k) => {
  const long = c.dist >= 15;
  const plan = long ? (c.dist >= 35 ? [[2, 5], [2, 6], [3, 5], [2, 8]] : [[2, 3], [3, 3], [2, 5], [3, 4]]) : [[4, 1], [5, 1], [6, 1], [4, 1.5]];
  const [r, km] = plan[Math.min(k, plan.length - 1)];
  const gp = c.goalPace ? `${mmss(c.goalPace)}/km` : paceRange(c, 'goal');
  return wrap(c, `Løbstempo ${r}x${km}km`, [blk(c, 'Main set', r, [[{ km }, 'goal'], [{ min: 2 }, 'rec']], gp)]);
};
const sSHARP = c => wrap(c, 'Skarphed (kort løbstempo)', [blk(c, 'Main set', 3, [[{ km: c.dist >= 15 ? 1.5 : 0.8 }, 'goal'], [{ min: 2 }, 'rec']])], 2, 1.5);
const sTEMPO = (c, k) => { const m = [20, 25, 30, 35, 40][Math.min(k, 4)]; return wrap(c, `Tempo ${m} min`, [blk(c, 'Main set', 1, [[{ min: m }, 'thr']], paceRange(c, 'thr'))]); };
const strides = c => blk(c, 'Strides', 4, [[{ s: 20 }, 'str'], [{ s: 60 }, 'rec']]);

function sEasy(c, km, withStrides, name = 'Rolig løbetur') {
  const m = blk(c, 'Easy', 1, [[{ km: Math.round(km * 10) / 10 }, 'easy']], paceRange(c, 'easy'));
  const s = withStrides ? strides(c) : { km: 0, lines: [] };
  return { name: withStrides ? name + ' + strides' : name, km: m.km + s.km, lines: [...m.lines, ...s.lines] };
}
function sLONG(c, km, progressive) {
  km = Math.round(km);
  const fin = progressive && km >= 14 ? Math.min(Math.round(km * 0.3), 8) : 0;
  const steps = fin ? [blk(c, 'Easy', 1, [[{ km: km - fin }, 'easy']], paceRange(c, 'easy')), blk(c, 'Finish', 1, [[{ km: fin }, c.goalPace ? 'goal' : 'steady']], c.goalPace ? `${mmss(c.goalPace)}/km` : paceRange(c, 'steady'))]
    : [blk(c, 'Long', 1, [[{ km }, 'easy']], paceRange(c, 'easy'))];
  return { name: `Langtur ${km} km${fin ? ' m. løbstempo-finish' : ''}`, km, lines: steps.flatMap(s => s.lines) };
}
function sSHAKE(c) { const m = blk(c, 'Shakeout', 1, [[{ km: 3 }, 'easy']]); const s = blk(c, 'Strides', 3, [[{ s: 20 }, 'str'], [{ s: 60 }, 'rec']]); return { name: 'Opvågningstur + strides', km: 3.5, lines: [...m.lines, ...s.lines] }; }
function sRACEDAY(c, ev) {
  const D = ev.distKm, gp = c.goalPace;
  if (!gp) return { name: ev.name, km: D, lines: [`Race`, `- ${D}km ${zt(c, 'steady')}`, ''] };
  const pct = c.goalPct, f = (a, b) => `${Math.round(a)}-${Math.round(b)}% Pace`;
  const a = Math.max(1, Math.round(D * 0.2)), z = Math.max(1, Math.round(D * 0.15)), mid = D - a - z;
  return { name: ev.name, km: D, lines: [
    `Kontrolleret start (${mmss(c.thr / ((pct - 1) / 100))}-${mmss(c.thr / ((pct - 3) / 100))}/km)`, `- ${a}km ${f(pct - 3, pct - 1)}`, '',
    `Løbstempo (${mmss(gp)}/km)`, `- ${mid.toFixed(1).replace(/\.0$/, '')}km ${f(pct - 1, pct + 1)}`, '',
    'Pres på hvis der er overskud', `- ${z}km ${f(pct, pct + 3)}`, ''] };
}

// ---- Antal løbepas pr. uge ----
function pickRunDays(avail, n, longDay, lower) {
  avail = [...new Set(avail)];
  if (n >= avail.length) return avail;
  const circ = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 7 - d); };
  const chosen = [avail.includes(longDay) ? longDay : avail[0]];
  while (chosen.length < n) {
    let best = null;
    for (const d of avail) {
      if (chosen.includes(d)) continue;
      const sc = Math.min(...chosen.map(c => circ(c, d))) - (lower.includes(d) ? 0.5 : 0);
      if (!best || sc > best.sc) best = { d, sc };
    }
    chosen.push(best.d);
  }
  return chosen;
}
// Anbefalet antal pas ud fra afstanden mellem nuværende tærskel og den tærskel målet kræver
function recommendRuns(P, dist, gapPct, availCount) {
  let n = gapPct <= 2 ? 3 : gapPct <= 5 ? 4 : 5;
  if (dist >= 35) n = Math.max(n, 4); else if (dist >= 15) n = Math.max(n, gapPct > 8 ? 5 : 4);
  if (P.weeklyKm < 20) n = Math.min(n, 4);
  return Math.max(3, Math.min(n, availCount, 6));
}

// ---- Planbygger ----
function buildPlan(S, startDate) {
  const P = S.profile, today = new Date(startDate); today.setHours(12, 0, 0, 0);
  const evs = S.events.filter(e => parseD(e.date) >= today).sort((a, b) => a.date.localeCompare(b.date));
  const A = evs.find(e => e.prio === 'A');
  if (!A) return { error: 'Tilføj mindst ét A-event i fremtiden.' };
  const thr = parsePace(P.thr), raceD = parseD(A.date);
  if (!(thr > 120 && thr < 600)) return { error: 'Tærskelpace skal være mellem 2:00 og 10:00 /km.' };
  const c = { thr, dist: A.distKm, ZN: { ...ZN, goal: ZN.steady } };
  const goalSec = A.goal ? parseTime(A.goal) : null;
  const wk0 = mondayOf(today), nW = Math.round((mondayOf(raceD) - wk0) / (7 * DAY)) + 1;
  const taperLen = A.distKm >= 35 ? 3 : A.distKm >= 15 ? 2 : 1, nt = nW - taperLen;
  // Forventet tærskel på løbsdagen: ~0,4 %/uge træningsfremgang, maks 4 %
  let feas = null;
  const gain = Math.min(0.004 * Math.max(nt, 0), 0.04), expThr = thr * (1 - gain);
  const predSec = (km, th) => km * th * Math.pow(km * th / 3600, 0.06); // Riegel ud fra tærskelpace
  if (goalSec) {
    const req = thrFromRace(A.distKm, goalSec), expPred = predSec(A.distKm, expThr), nowPred = predSec(A.distKm, thr);
    const ok = goalSec >= expPred * 0.995;
    const tgt = ok ? goalSec : expPred;
    c.goalPace = tgt / A.distKm; c.goalPct = thr / c.goalPace * 100; c.ZN.goal = [Math.round(c.goalPct - 1), Math.round(c.goalPct + 1)];
    feas = { ok, requiredThr: req, currentThr: thr, expectedThr: expThr, nowTime: nowPred, expectedTime: expPred, target: tgt,
      text: ok ? `Målet ${fmtTime(goalSec)} kræver tærskelpace ca. ${mmss(req)}/km. Med din nuværende (${mmss(thr)}/km) og ca. ${Math.round(gain * 1000) / 10}% fremgang frem til løbet er det realistisk.`
        : `Målet ${fmtTime(goalSec)} kræver tærskelpace ca. ${mmss(req)}/km. Du er på ${mmss(thr)}/km nu (svarer til ca. ${fmtTime(nowPred)}); med typisk fremgang frem til løbet forventer jeg ca. ${fmtTime(expPred)}. Løbstempo-pas og løbsdag er derfor sat til ${mmss(c.goalPace)}/km. Har du en nylig testtid, så skriv den ind (Zoner) – så justerer jeg.` };
  }
  const peakCap = A.distKm >= 35 ? 80 : A.distKm >= 15 ? 60 : A.distKm >= 9 ? 50 : 40;
  const longCap = A.distKm >= 35 ? 32 : A.distKm >= 15 ? 24 : A.distKm >= 9 ? 20 : 16;
  const taperF = A.distKm >= 35 ? [0.45, 0.65, 0.85] : A.distKm >= 15 ? [0.5, 0.8] : [0.6];
  const lower = P.lowerDays || [];
  const avail = P.runDays.length ? P.runDays : [2, 4, 6, 0];
  const gapPct = goalSec ? Math.max(0, (thr / thrFromRace(A.distKm, goalSec) - 1) * 100) : 0;
  const recommended = recommendRuns(P, A.distKm, gapPct, avail.length);
  const target = Math.min(avail.length, P.runsMode && P.runsMode !== 'auto' ? Number(P.runsMode) : recommended);
  const curRuns = Math.min(target, Math.max(2, P.currentRuns || 3));
  const runsInfo = { recommended, target, mode: P.runsMode || 'auto', current: curRuns, gapPct };
  const runsIn = (i, ov) => ov.runs ? Math.min(avail.length, Math.max(2, ov.runs)) : Math.min(target, curRuns + Math.floor(i / 4));
  // 1) ugevolumener
  let base = P.weeklyKm, peakRef = P.weeklyKm; const vols = [], phases = [], cut = [];
  for (let i = 0; i < nW; i++) {
    const fe = nW - 1 - i;
    if (fe < taperLen) { vols.push(null); phases.push(fe === 0 ? 'Løbsuge' : 'Nedtrapning'); cut.push(false); continue; }
    if (i > 0) base = Math.min(base * 1.07, Math.max(peakCap, P.weeklyKm));
    const isCut = i > 0 && (i + 1) % 4 === 0 && fe > taperLen;
    vols.push(isCut ? base * 0.8 : base); cut.push(isCut);
    peakRef = Math.max(peakRef, vols[i]);
    phases.push(nt >= 9 && i < Math.floor(nt / 3) ? 'Base' : (nt >= 4 && nt - i <= 3 ? 'Specifik' : 'Opbygning'));
  }
  for (let i = 0; i < nW; i++) if (vols[i] === null) vols[i] = peakRef * taperF[nW - 1 - i];
  // 2) uger -> workouts
  const cnt = { vo2: 0, thr: 0, race: 0, fart: 0, tempo: 0 };
  const workouts = [], weeks = [], warnings = []; let prevKm = null;
  for (let i = 0; i < nW; i++) {
    const mon = addD(wk0, 7 * i), ph = phases[i], ov = (S.overrides || {})[ymd(mon)] || {};
    const cnt_ = runsIn(i, ov), weekDays = pickRunDays(avail, cnt_, P.longDay, lower);
    const allDates = weekDays.map(d => addD(mon, (d + 6) % 7));
    let dates = allDates.filter(d => d >= today && d <= raceD);
    const others = evs.filter(e => e !== A && parseD(e.date) >= mon && parseD(e.date) < addD(mon, 7) && parseD(e.date) >= today);
    const raceSet = new Set(others.map(e => e.date));
    others.forEach(e => { if (!dates.some(d => ymd(d) === e.date)) dates.push(parseD(e.date)); });
    const isRaceWk = ph === 'Løbsuge';
    if (isRaceWk && !dates.some(d => ymd(d) === A.date)) dates.push(raceD);
    dates.sort((a, b) => a - b);
    if (!dates.length) { weeks.push({ i, monday: ymd(mon), phase: ph, km: 0, factor: 1 }); continue; }
    let vol = vols[i] * (ov.volume_factor || 1);
    if (prevKm && !cut[i] && ph !== 'Nedtrapning' && ph !== 'Løbsuge') vol = Math.min(vol, prevKm * 1.1); // aldrig mere end +10% ift. seneste normale uge
    vol *= Math.min(1, dates.filter(d => !raceSet.has(ymd(d))).length / Math.max(1, weekDays.length));
    const items = [];
    const mk = (d, s, cat = 'WORKOUT') => items.push({ date: ymd(d), name: s.name, desc: s.lines.join('\n').trim(), km: Math.round(s.km * 10) / 10, cat, phase: ph });
    const rd = d => d.getTime();
    if (isRaceWk) {
      // A-løbsuge
      for (const d of dates) {
        const delta = Math.round((raceD - d) / DAY);
        if (delta === 0) { mk(d, sRACEDAY(c, A), 'RACE_A'); continue; }
        if (delta === 1) mk(d, sSHAKE(c));
        else if (delta >= 3 && delta <= 5 && !items.some(x => x.name.startsWith('Skarphed'))) mk(d, sSHARP(c));
        else mk(d, sEasy(c, delta >= 3 ? 5 : 4, delta >= 3));
      }
    } else {
      const raceDates = others.map(e => parseD(e.date));
      const nearRace = (d, before, after) => raceDates.some(r => { const x = Math.round((d - r) / DAY); return x >= -before && x <= after; });
      const nonRace = dates.filter(d => !raceSet.has(ymd(d)));
      const longDate = raceDates.length ? null : (nonRace.find(d => d.getDay() === P.longDay) || nonRace[nonRace.length - 1]);
      let cands = nonRace.filter(d => (!longDate || Math.abs(d - longDate) > DAY) && !lower.includes((d.getDay() + 6) % 7) && !lower.includes(d.getDay()) && !nearRace(d, 2, 2));
      if (!cands.length) cands = nonRace.filter(d => d !== longDate && !nearRace(d, 2, 2));
      let nQ = ph === 'Base' || cut[i] || nonRace.length < 4 ? 1 : (ph === 'Nedtrapning' ? 1 : 2);
      if (raceDates.length) nQ = Math.min(nQ, 1);
      if (ov.max_quality !== undefined) nQ = Math.min(nQ, ov.max_quality);
      nQ = Math.min(nQ, cands.length);
      const qd = nQ === 0 ? [] : nQ === 1 ? [cands[0]] : [cands[0], cands[cands.length - 1]];
      const sess = new Map();
      qd.forEach((d, idx) => {
        let s;
        if (ph === 'Base') s = sFART(c, cnt.fart++);
        else if (ph === 'Nedtrapning') s = c.goalPace ? sSHARP(c) : sTHR(c, cnt.thr++);
        else if (ph === 'Specifik') s = (idx === 0 && (nQ === 1 || nQ === 2)) ? (c.goalPace ? sRACE(c, cnt.race++) : sVO2(c, cnt.vo2++)) : sTHR(c, cnt.thr++);
        else s = nQ === 2 ? (idx === 0 ? sVO2(c, cnt.vo2++) : sTHR(c, cnt.thr++)) : (i % 2 === 0 ? sTHR(c, cnt.thr++) : sVO2(c, cnt.vo2++));
        sess.set(rd(d), s);
      });
      const Q = [...sess.values()].reduce((a, s) => a + s.km, 0);
      const nEasy = nonRace.filter(d => d !== longDate && !sess.has(rd(d))).length;
      let L = 0;
      if (longDate) { const share = nonRace.length >= 4 ? 0.3 : nonRace.length === 3 ? 0.38 : 0.5; L = Math.max(8, Math.min(longCap, Math.round(vol * share))); if (ph === 'Nedtrapning') L = Math.min(L, Math.round(vol * 0.3)); }
      const easyKm = nEasy ? Math.max(4, Math.min((vol - L - Q) / nEasy, (L || 12) * 0.8)) : 0;
      let strideDone = false;
      for (const d of dates) {
        if (raceSet.has(ymd(d))) { const ev = others.find(e => e.date === ymd(d)); mk(d, sRACEDAY(c, ev.goal ? { ...ev } : ev), 'RACE_' + ev.prio); continue; }
        if (sess.has(rd(d))) { mk(d, sess.get(rd(d))); continue; }
        if (d === longDate) { mk(d, sLONG(c, L, (ph === 'Opbygning' || ph === 'Specifik') && !cut[i])); continue; }
        const short = nearRace(d, 2, 1);
        const st = !strideDone && ph !== 'Base' ? true : (!strideDone && ph === 'Base');

  if (!r.ok) throw new Error((j.error && j.error.message) || ('Claude API ' + r.status));

  out = extractJson(t);
  if (!out || typeof out.reply !== 'string') return { text: t.trim() || 'Jeg fik intet svar – prøv igen.', actions: [] };

// ===== AGENT 2: ZONE-AGENT =====
const ZONE_SYSTEM = `Du er en zone-agent for en løber. Du får nuværende zoneindstillinger, evidens fra de seneste ~12 ugers løb og et regelbaseret forslag. Du må KUN svare med JSON.
Principper: Ændr kun zoner, når evidensen er stærk (løbsresultat, eller en hård 20-minutters indsats med høj puls). Tærskelpace kan kun flyttes med ca. 1-6% pr. gang. En enkelt sprint-peak er ikke maxpuls. Rolige løb og dårlige dage er IKKE evidens for lavere tærskel. Ved tvivl: "hold".
Svar: {"verdict":"hold"|"update","threshold_pace":"m:ss","lthr":int,"max_hr":int,"rationale":"2-3 sætninger på dansk"}`;

async function gatherZoneEvidence() {
  const ss = await icu('/sport-settings');
  const run = (ss || []).find(s => (s.types || []).includes('Run'));
  if (!run) throw new Error('Fandt ingen løbe-indstillinger i Intervals.icu (Settings → Sport settings).');
  const cur = { thr: run.threshold_pace ? 1000 / run.threshold_pace : parsePace(S.profile.thr), lthr: run.lthr || S.profile.lthr, maxhr: run.max_hr || S.profile.maxHr };
  const acts = await icu(`/activities?oldest=${ymd(addD(new Date(), -84))}&newest=${ymd(new Date())}`);
  const runs = (acts || []).filter(a => /Run/.test(a.type || '') && a.moving_time > 600);
  const mh = runs.map(a => a.max_heartrate).filter(h => h >= 100).sort((a, b) => b - a);
  const obsMaxHr = mh.length >= 2 ? mh[1] : (mh[0] || null); // 2. højeste: dæmper enkeltstående pulsspikes
  const STD = [5, 10, 21.0975, 42.195]; let raceThr = null, raceSrc = null;
  for (const a of runs.filter(a => a.race)) {
    const km = a.distance / 1000, sd = STD.find(d => Math.abs(km - d) / d < 0.03);
    if (!sd) continue; const t = thrFromRace(sd, a.moving_time);
    if (!raceThr || t < raceThr) { raceThr = t; raceSrc = `${a.name || 'løb'} ${String(a.start_date_local || '').slice(0, 10)} (${sd.toFixed(1)} km, ${fmtTime(a.moving_time)})`; }
  }
  const hard = [...runs].filter(a => a.moving_time >= 1500).sort((a, b) => (b.average_speed || 0) - (a.average_speed || 0)).slice(0, 6);
  let w20 = null, w20src = null, streamsFailed = 0;
  for (const a of hard) {
    try {
      const st = await icuActivity(`/${a.id}/streams?types=velocity_smooth,heartrate`);
      const get = k => Array.isArray(st) ? (st.find(s => s.type === k) || {}).data : (st && st[k]);
      const w = bestWindow(get('velocity_smooth'), get('heartrate'), 1200);
      if (w && (!w20 || w.speed > w20.speed)) { w20 = w; w20src = `${a.name || 'løb'} ${String(a.start_date_local || '').slice(0, 10)}`; }
    } catch (e) { streamsFailed++; }
  }
  return { run, cur, ev: { obsMaxHr, raceThr, raceSrc, w20, w20src, runsAnalysed: runs.length, streamsFailed } };
}

async function zoneAgentRun() {
  const { run, cur, ev } = await gatherZoneEvidence();
  const det = proposeZones(cur, ev);
  let agent = null, final = { thr: det.thr, lthr: det.lthr, maxhr: det.maxhr };
  if (S.keys.anthropic) {
    try {
      const out = await claude(ZONE_SYSTEM, JSON.stringify({ nu: { tærskelpace: mmss(cur.thr), lthr: cur.lthr, maxpuls: cur.maxhr },
        evidens: { observeret_maxpuls: ev.obsMaxHr, løbsresultat_tærskelpace: ev.raceThr && mmss(ev.raceThr), løbskilde: ev.raceSrc,
          bedste_20min: ev.w20 && { pace: mmss(1000 / ev.w20.speed), puls: ev.w20.hr && Math.round(ev.w20.hr), kilde: ev.w20src }, løb_analyseret: ev.runsAnalysed },
        regelbaseret_forslag: { tærskelpace: mmss(det.thr), lthr: det.lthr, maxpuls: det.maxhr, begrundelse: det.why } }), 800);
      const t = out.threshold_pace ? parsePace(out.threshold_pace) : cur.thr;
      const ok = out.verdict === 'update' && Math.abs(t / cur.thr - 1) <= 0.06 && Math.abs((out.lthr || cur.lthr) - cur.lthr) <= 8 && (out.max_hr || cur.maxhr) <= Math.max(ev.obsMaxHr || 0, cur.maxhr) + 3;
      agent = { verdict: out.verdict, rationale: String(out.rationale || ''), accepted: ok };
      if (out.verdict === 'hold') final = { thr: cur.thr, lthr: cur.lthr, maxhr: cur.maxhr };
      else if (ok) final = { thr: t, lthr: Math.round(out.lthr || cur.lthr), maxhr: Math.round(out.max_hr || cur.maxhr) };
    } catch (e) { agent = { error: e.message }; }
  }
  const changed = final.thr !== cur.thr || final.lthr !== cur.lthr || final.maxhr !== cur.maxhr;
  return { runId: run.id, cur, ev, det, agent, final: { ...final, zones: hrZones(final.lthr, final.maxhr) }, changed, at: new Date().toISOString() };
}

async function applyZones(zr) {
  const f = zr.final;
  await icu('/sport-settings/' + zr.runId, { method: 'PUT', body: JSON.stringify({ threshold_pace: 1000 / f.thr, lthr: f.lthr, max_hr: f.maxhr, hr_zones: f.zones }) });

}

const MENU_SYSTEM = `Du er kostplanlægger for en motionsløber i Danmark. Du får, pr. dag, kalorie- og makromål, dagstype (løb/styrke) og om det er en arbejdsdag. Svar KUN med JSON.

function lunchAssumed(N) { const k = N.lunchKcal || 650; return { kcal: k, p: Math.round(k * 0.2 / 4), c: Math.round(k * 0.5 / 4), f: Math.round(k * 0.3 / 9) }; }
function nutritionReady(N) { return (N.sex === 'm' || N.sex === 'k') && N.age > 15 && N.heightCm > 120 && (N.weightKg > 30 || (S.weights && S.weights.length)); }
function targetsFor(dates) {
  const N = S.nutrition, out = {}; N.weightKg = N.weightKg || (S.weights.length ? S.weights[S.weights.length - 1].kg : 0);

const KIND_DA = { rest: 'hviledag', easy: 'rolig løbedag', quality: 'kvalitetsløb', long: 'langtur', race: 'løbsdag' };

async function menuChunk(dates, targets, feedback) {
  const N = S.nutrition, L = lunchAssumed(N);
  const days = dates.map(d => {
    const t = targets[d], work = (N.workdays || []).includes(parseD(d).getDay());
    const m = work ? { kcal: t.kcal - L.kcal, p: t.p - L.p, c: t.c - L.c, f: t.f - L.f } : { kcal: t.kcal, p: t.p, c: t.c, f: t.f };
    return { date: d, ugedag: DOW[parseD(d).getDay()], arbejdsdag: work, dagstype: KIND_DA[t.kind], løb_km: t.km, styrketræning: t.strength, dag_før_løb: t.eve, måltider_skal_summere_til: m, note: t.why || undefined };
  });
  const payload = { personer: N.people || 1, kostønsker_allergier: N.prefs || 'ingen', dage: days, ...(feedback ? { ret_følgende: feedback } : {}) };
  const out = await claude(MENU_SYSTEM, JSON.stringify(payload), 9000);

function cleanMenuDays(days) {

    const meals = (d.meals || []).filter(m => !(work && /frokost/i.test(m.slot || ''))).map(m => ({
      slot: String(m.slot || 'snack'), name: String(m.name || '').slice(0, 80), kcal: Math.round(+m.kcal || 0), p: Math.round(+m.p || 0), c: Math.round(+m.c || 0), f: Math.round(+m.f || 0),

    return { date: d.date, meals };

}
async function generateMenu(startDate) {
  const N = S.nutrition; if (!nutritionReady(N)) throw new Error('Udfyld kost-profilen under Indstillinger først.');

// ---------- VÆGT ----------
function weightChart(ws) {
  if (ws.length < 2) return '';
  const w = [...ws].sort((a, b) => a.date.localeCompare(b.date)).slice(-60), ma = movingAvg(w);
  const xs = w.map(x => parseD(x.date).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const ys = w.map(x => x.kg).concat(ma.map(x => x.kg)), y0 = Math.min(...ys) - 0.5, y1 = Math.max(...ys) + 0.5;
  const X = t => 10 + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * 300, Y = v => 10 + (1 - (v - y0) / (y1 - y0)) * 110;
  return `<svg viewBox="0 0 320 130" class="chart"><polyline fill="none" stroke="var(--line)" stroke-width="1" points="${w.map((p, i) => X(xs[i]) + ',' + Y(p.kg)).join(' ')}"/>${w.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.kg)}" r="2.5" fill="var(--mut)"/>`).join('')}
    <polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${ma.map((p, i) => X(xs[i]) + ',' + Y(p.kg)).join(' ')}"/><text x="10" y="126" font-size="9" fill="var(--mut)">${y0.toFixed(1)}–${y1.toFixed(1)} kg · blå = 7-dages gennemsnit</text></svg>`;
}
const MEAS = [['waist', 'Talje (ved navlen)'], ['belly', 'Mave (det bredeste)'], ['chest', 'Bryst'], ['hip', 'Hofte/balder'], ['thigh', 'Lår'], ['arm', 'Overarm'], ['neck', 'Hals']];
function measCard() {
  const ms = [...(S.measures || [])].sort((a, b) => a.date.localeCompare(b.date));
  let h = `<form id="mf" class="card"><h3>Log mål (cm)</h3><label>Dato<input name="date" type="date" value="${todayStr()}" required></label>
    <div class="trio">${MEAS.map(([k, n]) => `<label>${n}<input name="${k}" type="number" step="0.1" min="10" max="250" inputmode="decimal"></label>`).join('')}</div>
    <div class="row"><button class="pri">Gem mål</button></div>
    <span class="mut">Udfyld kun det, du måler. Mål med målebånd mod bar hud, afslappet (efter udånding), samme sted hver gang, og gerne samme ugedag som vejningen. Talje og mave er de vigtigste at følge – de siger mere om fedttab end vægten alene.</span></form>`;
  if (!ms.length) return h;
  const last = f => { const x = [...ms].reverse().find(m => m[f] > 0); return x ? { d: x.date, v: x[f] } : null; };
  const first = f => { const x = ms.find(m => m[f] > 0); return x ? { d: x.date, v: x[f] } : null; };
  const prev = f => { const xs = ms.filter(m => m[f] > 0); return xs.length > 1 ? xs[xs.length - 2] : null; };
  const df = (n, base) => { const d = Math.round((n - base) * 10) / 10; return d === 0 ? '±0' : (d > 0 ? '+' : '−') + Math.abs(d).toString().replace('.', ','); };
  const rows = MEAS.map(([k, n]) => { const l = last(k); if (!l) return ''; const f = first(k), p = prev(k);
    return `<tr><td>${n}</td><td>${l.v} cm</td><td>${p ? df(l.v, p[k]) : '–'}</td><td>${f.d !== l.d ? df(l.v, f.v) : '–'}</td></tr>`; }).join('');
  h += `<div class="card"><b>Mål – udvikling</b><table class="tight"><tr><td></td><td>seneste</td><td>siden sidst</td><td>siden start</td></tr>${rows}</table>
    <span class="mut">Seneste måling: ${esc(ms[ms.length - 1].date)}. Negative tal (−) er tabte cm.</span></div>`;
  h += [...ms].reverse().slice(0, 8).map(m => `<div class="ev"><div>${esc(m.date)} · ${MEAS.filter(([k]) => m[k] > 0).map(([k, n]) => `${n.split(' ')[0].toLowerCase()} <b>${m[k]}</b>`).join(' · ')}</div><button data-act="delm" data-date="${esc(m.date)}">Slet</button></div>`).join('');
  return h;
}
function viewWeight() {

    h += `<div class="card"><b>Kropssammensætning (${esc(fatL.d)})</b><br>${kg ? kg + ' kg · ' : ''}fedt ${fatL.v.toFixed(1)} %${kg ? ' (≈ ' + (kg * fatL.v / 100).toFixed(1) + ' kg fedt, ' + (kg * (1 - fatL.v / 100)).toFixed(1) + ' kg fedtfri)' : ''}${mu ? ' · muskelmasse ' + mu.v + ' kg' + tag(mu) : ''}${bo ? ' · knogler ' + bo.v + ' kg' + tag(bo) : ''}${wa ? ' · vand ' + wa.v + ' %' + tag(wa) : ''}<br><span class="mut">Tal fra vægte (bioimpedans) svinger med væskebalance – se på trenden over uger, ikke enkeltdage.</span></div>`; }

    <p><b>Apple Sundhed – to veje:</b><br>1) <i>Automatisk:</i> Apples sundhedsdata kan ikke læses af en webapp. Brug appen Genveje: lav en Automatisering (fx kl. 07:30 hver dag) der finder dagens værdier i Apple Sundhed (fx hvilepuls, HRV, skridt, søvn) og sender dem med “Hent indhold fra URL” (metode PUT) til <code>https://intervals.icu/api/v1/athlete/0/wellness/ÅÅÅÅ-MM-DD</code> med header <code>Authorization</code> og en JSON-krop som <code>{"restingHR":52,"hrvSDNN":58,"steps":9400}</code>. Så henter appen dem fra Intervals.icu. Send kun felter, Garmin ikke allerede leverer – sender begge det samme felt, vinder den sidste skrivning. Jeg kan ikke teste Genveje herfra, så handlingsnavne og feltnavne kan afvige lidt.<br>2) <i>Fil:</i> Sundhed → din profil → Eksportér alle sundhedsdata → vælg filen ovenfor. Eksporten er stor (ofte flere hundrede MB) og læses i bidder; på en telefon kan det tage et par minutter. Zip64 (over 4 GB) understøttes ikke – pak ud og vælg export.xml.</p>

function fileToB64(file) {
  return new Promise((res, rej) => {
    const fr = () => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Kunne ikke læse billedet.')); r.readAsDataURL(file); };
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const g = c.getContext('2d'); if (!g) return fr(); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      } catch (e) { fr(); }
    };
    img.onerror = () => rej(new Error('Kunne ikke læse billedet.')); img.src = url;
  });
}

  if (id === 'draftf') {
    const kcal = Number(f.get('kcal')); if (!(kcal > 0)) return note('err', 'Angiv kcal.');
    S.food.push({ id: Date.now(), date: todayStr(), name: String(f.get('name')), slot: String(f.get('slot')), kcal, p: Number(f.get('p')) || 0, c: Number(f.get('c')) || 0, f: Number(f.get('f')) || 0, src: draft.src });
    draft = null; save(); render();
  }
  if (id === 'wf') {
    const kg = Number(f.get('kg')); if (!(kg >= 30 && kg <= 250)) return note('err', 'Angiv en vægt mellem 30 og 250 kg.');
    S.weights = mergeWeight(S.weights, { date: String(f.get('date')), kg, src: 'manuel' }); save(); render();
  }
  if (id === 'cf') { const q = String(f.get('q') || ''); if (busy) return; sendCoach(q); return; }
  if (id === 'mf') {
    const date = String(f.get('date')), m = { date };
    for (const [k] of MEAS) { const v = Number(String(f.get(k) || '').replace(',', '.')); if (v) { if (!(v >= 10 && v <= 250)) return note('err', 'Mål skal være mellem 10 og 250 cm.'); m[k] = v; } }
    if (Object.keys(m).length < 2) return note('err', 'Udfyld mindst ét mål.');
    const old = (S.measures || []).find(x => x.date === date); S.measures = (S.measures || []).filter(x => x.date !== date); S.measures.push({ ...(old || {}), ...m });
    S.measures.sort((a, b) => a.date.localeCompare(b.date)); save(); render();
  }
  if (id === 'setf') {
    const P = S.profile, K = S.keys, N = S.nutrition;
    P.weeklyKm = Number(f.get('weeklyKm')); P.currentRuns = Number(f.get('currentRuns')) || 3; P.thr = String(f.get('thr')); P.lthr = Number(f.get('lthr')); P.maxHr = Number(f.get('maxHr'));
    P.runDays = f.getAll('runDays').map(Number); P.longDay = Number(f.get('longDay')); P.lowerDays = f.getAll('lowerDays').map(Number);
    N.strengthDays = f.getAll('strengthDays').map(Number); N.workdays = f.getAll('workdays').map(Number);
    N.sex = String(f.get('sex')); N.age = Number(f.get('age')) || 0; N.heightCm = Number(f.get('heightCm')) || 0; N.weightKg = Number(f.get('weightKg')) || 0;
    N.goal = String(f.get('goal')); N.goalWeightKg = Number(f.get('goalWeightKg')) || 0; N.rateKgWk = Math.min(0.5, Math.max(0.1, Number(f.get('rateKgWk')) || 0.3)); N.people = Math.max(1, Number(f.get('people')) || 1);
    N.lunchKcal = Number(f.get('lunchKcal')) || 650; N.prefs = String(f.get('prefs')).trim();
    K.icu = String(f.get('icu')).trim(); K.athlete = String(f.get('athlete')).trim() || '0'; K.anthropic = String(f.get('anthropic')).trim(); K.model = String(f.get('model')).trim() || 'claude-sonnet-5-5';
    if (P.runDays.length < 2) return note('err', 'Vælg mindst to løbedage.');
    if (!P.runDays.includes(P.longDay)) return note('err', 'Langtur-dagen skal være en af dine løbedage.');
    if (S.plan) { try { rebuild(); } catch (er) { /* planen bygges igen fra Plan-fanen */ } }
    save(); note('ok', 'Gemt.');
  }
});

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ikke understøttet */ }
render();
if (S.keys.icu && (!S.sync || !S.sync.last || Date.now() - new Date(S.sync.last) > 6 * 36e5)) { syncIntervalsWellness().then(() => { save(); render(); }, er => { S.sync = { ...(S.sync || {}), error: er.message }; save(); }); }
if (S.autoZone && S.keys.icu && (!S.lastZoneCheck || Date.now() - new Date(S.lastZoneCheck) > 7 * DAY)) { S.tab = 'zones'; run('Zone-agent tjekker zoner (ugentligt)', async () => { S.zoneResult = await zoneAgentRun(); S.lastZoneCheck = S.zoneResult.at; }); }

</script></body></html>
